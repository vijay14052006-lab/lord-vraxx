<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vraxxGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#08090d" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#vraxxGlow)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Stylized Geometric 'V' Crown Emblem -->
  <polygon points="50,82 22,28 36,28 50,60 64,28 78,28" fill="url(#vraxxGlow)" filter="url(#glowFilter)" />
  <circle cx="50" cy="22" r="4.5" fill="#00f2fe" />
  <circle cx="30" cy="22" r="3" fill="#a855f7" />
  <circle cx="70" cy="22" r="3" fill="#ff007f" />
</svg>